name: Дневной сектор

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  daily-sector:
    runs-on: ubuntu-latest

    steps:
      - name: Восстановить память Дневного сектора
        uses: actions/cache/restore@v4
        with:
          path: sector-memory.txt
          key: day-sector-memory-${{ github.run_id }}
          restore-keys: |
            day-sector-memory-

      - name: Запустить Дневной сектор
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          # Берём компактную память предыдущих выпусков.
          # Не позволяем ей бесконечно разрастаться.
          if [ -f sector-memory.txt ]; then
            PREVIOUS=$(tail -c 16000 sector-memory.txt)
          else
            PREVIOUS="Предыдущих выпусков в памяти нет."
          fi

          PROMPT=$(cat <<'EOF'
          Ты редактор проекта «Дневной сектор 3.0».

          Работай по редакционной системе «Утреннего сектора 3.0».
          Сохраняй редакционную политику, тематические приоритеты,
          иерархию источников, поиск первоисточников, фактчекинг,
          перекрёстную проверку, разграничение факта, заявления,
          версии и оценки, проверку позиций сторон, московскую оптику,
          редакционную дисциплину ТАСС, третий голос Metro,
          три уровня заголовков, SEO и обязательный LEGAL CHECK.

          Точность важнее скорости.

          РЕЖИМ ДНЕВНОГО СЕКТОРА:

          Проверяй только события, впервые появившиеся или существенно
          изменившиеся после предыдущего запуска.

          Не делай обзор всего дня заново.

          Уже выданную новость повторно не выдавай.

          Перепечатка старой информации не является новой новостью.

          Старый сюжет допускается только при наличии существенного
          подтверждённого развития.

          Для развивающегося сюжета установи:
          БЫЛО — что было известно раньше.
          СТАЛО — какой существенный новый факт появился сейчас.

          Центр нового материала — СТАЛО.

          Telegram и социальные сети используй как радар, а не как
          доказательство. По возможности устанавливай первоисточник.

          Не выдавай заявление за установленный факт.

          Каждый материал проходит:
          сигнал → проверка свежести → антидубль → первоисточник →
          фактчекинг → сверка → позиции сторон → оценка значимости →
          третий голос → заголовки → контекст → SEO → LEGAL CHECK.

          Если ключевой факт не подтверждён, имеются неустранимые
          противоречия или правовой риск не снят — материал не выдавай.

          ЭКОНОМНЫЙ РЕЖИМ:

          Не пытайся заполнить выпуск количеством.

          Отбирай максимум 3 наиболее значимых новых или существенно
          обновившихся сюжета за текущее окно мониторинга.

          Если достоин публикации только один сюжет — выдай один.

          Если достойных новых сюжетов нет — ответь только:
          «Дневной сектор: новых подтверждённых материалов нет.»

          Не пересказывай старые новости ради заполнения выпуска.
          Не повторяй один и тот же контекст без необходимости.
          Пиши компактно, но не жертвуй фактчекингом и правовым контролем.

          Для каждого публикуемого сюжета дай:
          1. H1.
          2. Короткий лид.
          3. Что произошло / что изменилось.
          4. Ключевые подтверждённые факты.
          5. Необходимый контекст.
          6. Источники или первоисточники.
          7. SEO-заголовок.
          8. Редакционный заголовок.

          Не раскрывай внутренние рассуждения, служебные проверки
          и скрытые цепочки рассуждений. Выдавай готовый редакционный результат.
          EOF
          )

          FULL_PROMPT="${PROMPT}

          АНТИДУБЛЬ. Ниже находится компактная память предыдущих выпусков.
          Не повторяй уже опубликованные сюжеты, если после публикации
          не появилось существенного подтверждённого нового факта.

          --- ПАМЯТЬ ПРЕДЫДУЩИХ ВЫПУСКОВ ---
          ${PREVIOUS}
          --- КОНЕЦ ПАМЯТИ ---"

          PAYLOAD=$(jq -n \
            --arg input "$FULL_PROMPT" \
            '{
              model: "gpt-6-luna",
              tools: [
                {
                  type: "web_search"
                }
              ],
              max_output_tokens: 3000,
              max_tool_calls: 4,
              input: $input
            }')

          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "Попытка OpenAI: ${ATTEMPT}"

            HTTP_CODE=$(curl --silent --show-error \
              -D headers.txt \
              -o response.json \
              -w "%{http_code}" \
              https://api.openai.com/v1/responses \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -d "$PAYLOAD")

            echo "OpenAI HTTP status: ${HTTP_CODE}"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              SUCCESS=1
              break
            fi

            echo "Ответ OpenAI:"
            cat response.json

            if [ "$HTTP_CODE" = "429" ]; then
              RETRY_AFTER=$(grep -i '^retry-after:' headers.txt \
                | tail -1 \
                | awk '{print $2}' \
                | tr -d '\r')

              if [[ "$RETRY_AFTER" =~ ^[0-9]+$ ]] && [ "$RETRY_AFTER" -le 300 ]; then
                echo "Лимит временно исчерпан. Ждём ${RETRY_AFTER} секунд."
                sleep "$RETRY_AFTER"
              elif [ "$ATTEMPT" -lt 3 ]; then
                WAIT=$((ATTEMPT * 60))
                echo "429 без короткого Retry-After. Ждём ${WAIT} секунд."
                sleep "$WAIT"
              fi
            else
              echo "Ошибка не является временным rate limit."
              exit 1
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Лимит OpenAI пока не освободился."
            echo "Этот часовой запуск пропускаем. Следующий запуск попробует снова."
            exit 0
          fi

          MESSAGE=$(jq -r '
            [
              .output[]
              | select(.type == "message")
              | .content[]
              | select(.type == "output_text")
              | .text
            ]
            | join("\n")
          ' response.json)

          if [ -z "$MESSAGE" ] || [ "$MESSAGE" = "null" ]; then
            echo "Не удалось получить текст выпуска."
            cat response.json
            exit 1
          fi

          echo "Ответ OpenAI успешно получен."

          # Telegram ограничивает размер одного сообщения.
          # Делим длинный выпуск на безопасные части.
          printf '%s' "$MESSAGE" > telegram-message.txt

          split -b 3500 \
            --additional-suffix=.txt \
            telegram-message.txt telegram-part-

          for PART in telegram-part-*.txt; do
            PART_TEXT=$(cat "$PART")

            curl --fail --silent --show-error \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${PART_TEXT}"

            sleep 1
          done

          # Добавляем новый выпуск в память антидублей.
          {
            if [ -f sector-memory.txt ]; then
              tail -c 12000 sector-memory.txt
            fi

            echo ""
            echo "===== ВЫПУСК ====="
            printf '%s\n' "$MESSAGE"
          } > sector-memory-new.txt

          mv sector-memory-new.txt sector-memory.txt

          # Ограничиваем размер памяти.
          tail -c 16000 sector-memory.txt > sector-memory-trimmed.txt
          mv sector-memory-trimmed.txt sector-memory.txt

          echo "Дневной сектор успешно завершён."

      - name: Сохранить память Дневного сектора
        if: success()
        uses: actions/cache/save@v4
        with:
          path: sector-memory.txt
          key: day-sector-memory-${{ github.run_id }}
