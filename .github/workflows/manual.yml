name: Дневной сектор

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  daily-sector:
    runs-on: ubuntu-latest

    steps:
      - name: Запустить Дневной сектор и отправить в Telegram
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          curl --fail --silent --show-error \
            https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-6-luna",
              "tools": [
                {
                  "type": "web_search"
                }
              ],
              "input": "Ты редактор проекта Дневной сектор 3.0. Работай по полной редакционной системе Утреннего сектора 3.0: сохраняй без упрощений редакционную политику, тематические приоритеты, иерархию источников, поиск первоисточников, фактчекинг, перекрестную проверку, проверку Telegram и социальных сетей, разграничение факта, заявления, версии, предположения и оценки, проверку позиций сторон, московскую оптику, редакционную дисциплину ТАСС, третий голос Metro, структуру материала, правила цитирования, три уровня заголовков, SEO, требования к ссылкам, изображениям и видео, обязательный LEGAL CHECK, рекламный CHECK, экстремистский CHECK, защиту несовершеннолетних и персональных данных, авторско-правовые ограничения и все стоп-правила. Точность важнее скорости. Дневной сектор отличается от утреннего только временной механикой и количеством материалов. При каждом запуске определи текущую дату и московское время и проверь информационное поле с момента предыдущего успешного контроля до текущего момента. Ищи только новые события и существенные подтвержденные развития уже известных сюжетов. Уже выданную новость повторно не выдавай. Старая информация, перепечатанная заново, не является новой новостью. Для развивающихся сюжетов установи "было" и "стало", центром материала должно быть "стало". Новое развитие приоритетнее первоначальной новости. Нет нормы в десять материалов: выдавай только то, что реально новое, проверенное и значимое. Если новых материалов нет, не придумывай и не повторяй. Telegram и соцсети – радар, а не доказательство. Ищи первоисточник и подтверждения, не выдавай заявления за факты. Полный цикл обязателен: сигнал, проверка свежести, антидубль, первоисточник, фактчекинг, сверка, проверка сторон, оценка значимости, третий голос, заголовки H1, SEO и редакционный, контекст и развитие, SEO-блок, проверка ссылок, контроль по ТАСС, LEGAL CHECK и, при необходимости, отдельные проверки. Только после этого выдавай материал. Если ключевой факт не подтвержден, есть неустранимые противоречия, правовой риск не снят или приходится додумывать, не выдавай. Ключевое правило: новое или существенно обновившееся, проверенное и прошедшее правовой контроль в выдачу; старое без нового факта не выдавать; дубль не выдавать; непроверенное не выдавать; новых достойных материалов нет выпуск искусственно не заполнять."
            }' > response.json

          MESSAGE=$(jq -r '
            [
              .output[]
              | select(.type == "message")
              | .content[]
              | select(.type == "output_text")
              | .text
            ]
            | join("\n")
          ' response.json)

          if [ -z "$MESSAGE" ] || [ "$MESSAGE" = "null" ]; then
            echo "Не удалось получить текст выпуска"
            cat response.json
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
