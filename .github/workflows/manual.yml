name: Дневной сектор

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  daily-sector:
    runs-on: ubuntu-latest

    steps:
      - name: Запустить Дневной сектор
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl --fail --silent --show-error https://api.openai.com/v1/responses \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-6-luna",
              "tools": [{"type": "web_search"}],
              "input": "Ты редактор проекта «Дневной сектор». Изучи актуальное информационное поле с помощью веб-поиска. Найди наиболее значимые новые события. Не выдумывай факты. Подготовь краткий выпуск на русском языке. Структура: главное; что изменилось; почему важно; что отслеживать дальше."
            }' | tee response.json

          cat response.json
